# Phase 3: Network B (descent flow) in isolation.
phase: 3
lr: 1.0e-3
batch_size: 32
epochs: 100
seed: 0
# Saddle-biased time sampling (Beta(0.5, 1.5)); uniform overweights the tail.
t_alpha: 0.5
t_beta: 1.5
noise_sigma: 0.0          # set to ~median NEB image spacing to robustify B
lambda_c: 0.05            # contractivity weight (target ~10% of velocity loss)
lambda_e: 0.1             # endpoint correction, late training only
endpoint_start_frac: 0.8  # turn on endpoint loss at 80% of training
contractivity_gate: 0.2   # only penalize away from the saddle (t > 0.2)
contractivity_iters: 6
endpoint_steps: 16
eval_steps: 32            # RK4 steps at evaluation
grad_clip: 10.0
